<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>
        .container {
            display: flex;
            flex-direction: column;
        }

        .box {
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>

    <h1>My Three Sections</h1>

    <div class="container">

        <div class="box">
            <h2>Section 1</h2>
            <p>This is first section.</p>
        </div>

        <div class="box">
            <h2>Section 2</h2>
            <p>This is second section.</p>
        </div>

        <div class="box">
            <h2>Section 3</h2>
            <p>This is third section.</p>
        </div>

    </div>

</body>
</html>
